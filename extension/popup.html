<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 -apple-system, system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #1a1a1a; }
      h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #c33; display: inline-block; }
      .dot.on { background: #2a2; }
      .row { margin: 8px 0; }
      label { display: block; font-weight: 600; margin-bottom: 3px; font-size: 12px; }
      input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 5px; font-family: monospace; font-size: 11px; }
      button { padding: 7px 10px; border: 0; border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer; font-size: 12px; }
      button.secondary { background: #eee; color: #1a1a1a; }
      button:disabled { opacity: 0.5; cursor: default; }
      .muted { color: #777; font-size: 11px; }
      .tab { font-size: 11px; color: #555; word-break: break-all; margin: 4px 0; }
      .status { font-size: 12px; margin-bottom: 8px; }
      .actions { display: flex; gap: 6px; }
      hr { border: 0; border-top: 1px solid #eee; margin: 12px 0; }
    </style>
  </head>
  <body>
    <h1><span id="dot" class="dot"></span> iframer</h1>
    <div class="status" id="status">Checking…</div>

    <div class="row">
      <label for="token">Pairing token</label>
      <input id="token" type="password" placeholder="paste from ~/.iframer/secret" />
      <div class="muted" style="margin-top:4px;">Run <code>cat ~/.iframer/secret</code> (or use your IFRAMER_SECRET) and paste it here.</div>
    </div>
    <div class="actions">
      <button id="save">Save &amp; connect</button>
    </div>

    <hr />

    <div class="row">
      <label>This tab</label>
      <div class="tab" id="curtab">…</div>
      <div class="actions">
        <button id="allow">Allow this tab</button>
        <button id="disallow" class="secondary">Revoke</button>
      </div>
      <div class="muted" id="allowstate" style="margin-top:6px;"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
