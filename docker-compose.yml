name: iframer

services:
  api:
    container_name: iframer-api
    build: .
    restart: unless-stopped
    ports:
      - "3021:3021"
      - "6080-6099:6080-6099"
    env_file:
      - .env
    environment:
      - PORT=3021
      - VNC_BASE_DISPLAY=99
      - VNC_MAX_SESSIONS=20
      - VNC_SESSION_TIMEOUT_MS=300000
    volumes:
      - iframer-data:/root/.iframer

volumes:
  iframer-data:
