<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #0d1117; }
  .term {
    width: 480px; height: 360px; box-sizing: border-box;
    background: #0d1117; color: #c9d1d9;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 20px; white-space: pre-wrap; word-break: break-word;
  }
  .bar { display:flex; gap:6px; margin-bottom:14px; }
  .dot { width:11px; height:11px; border-radius:50%; }
  .r{background:#ff5f56} .y{background:#ffbd2e} .g{background:#27c93f}
  .prompt { color: #58a6ff; }
  .out { color: #8b949e; }
  .hl { color: #56d364; }
  .cursor { display:inline-block; width:8px; height:16px; background:#c9d1d9; vertical-align:-3px; }
</style>
</head>
<body>
<div class="term">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
  <div id="out"></div>
</div>
<script>
const CMD = `iframer-toolkit reverse-engineer '[navigate, click #load]' --output docs/example/api`;
const stage = new URLSearchParams(location.search).get('s') || '1';
const el = document.getElementById('out');

function render(html) { el.innerHTML = html; }

if (stage === '1') {
  render(`<span class="prompt">$ </span><span class="cursor"></span>`);
} else if (stage === '2') {
  render(`<span class="prompt">$ </span>${CMD}<span class="cursor"></span>`);
} else if (stage === '3') {
  render(`<span class="prompt">$ </span>${CMD}\n\n<span class="out">Captured 1 endpoint...</span>`);
} else {
  render(`<span class="prompt">$ </span>${CMD}\n\n<span class="hl">GET /todos/{id} → getTodos</span>\n<span class="out">Saved to: docs/example/api/captured-api.json</span>`);
}
</script>
</body>
</html>
